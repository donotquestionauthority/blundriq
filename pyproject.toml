[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "blundriq"
version = "0.1.0"
description = "Personal chess improvement tool: blunders, repertoire deviations, puzzles, scouting, review."
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "psycopg[binary,pool]>=3.3",
    "pydantic>=2.14",
    "bcrypt>=5.0",
    "itsdangerous>=2.2",
    "chess>=1.11.2",
    "httpx>=0.28",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "pyright>=1.1.414",
    "pyyaml>=6.0",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "api*", "pipeline*"]

[tool.setuptools.package-data]
core = ["sql/schema.sql", "sql/migrations/*"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "TID", "UP"]

# Secrets and configuration are read in exactly one place each (see core/secrets.py).
# Anything else touching the environment is a lint error, not a review comment.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Environment reads live only in core/secrets.py. Add the secret there; it fails closed."
"os.getenv".msg = "Environment reads live only in core/secrets.py. Add the secret there; it fails closed."
"os.putenv".msg = "Do not mutate the environment."
"dotenv".msg = "No dotenv. Secrets arrive as real environment variables."

[tool.ruff.lint.per-file-ignores]
"core/secrets.py" = ["TID251"]
"core/prompts.py" = ["E501"]  # verbatim prompt text; wrapping would change it
"api/routes/*" = ["B008"]
"tests/*" = ["E501"]  # fixture SQL and payloads read better on one line
"tools/*" = ["E501"]  # FastAPI Depends()/Query() in defaults is the framework idiom

# --- pyright ----------------------------------------------------------------
[tool.pyright]
include = ["core", "api", "pipeline", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"
strict = ["core"]

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
