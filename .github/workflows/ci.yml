name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/blundriq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install gitleaks (the rule-probe tests run it)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: pytest
      - name: Ordinary (non-editable) install ships the SQL and the CLI works
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/blundriq_install
        run: |
          python -m venv /tmp/installed && /tmp/installed/bin/pip install -q .
          psql postgresql://postgres:ci@localhost:5432/postgres -c 'CREATE DATABASE blundriq_install'
          cd /tmp
          /tmp/installed/bin/pipeline db init
          /tmp/installed/bin/pipeline db version | tee /tmp/version.txt
          grep -q '^database: 0; latest: 0$' /tmp/version.txt || { echo "unexpected version output"; exit 1; }

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test -- --run
      - run: npm run build

  secrets-scan:
    # Detection after publication. The pre-push hook is what prevents a leak;
    # this catches anything that got past it and blocks the merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"
