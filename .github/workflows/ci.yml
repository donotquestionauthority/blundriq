name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/blundriq_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install gitleaks (the rule-probe tests run it)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: pytest
      - name: Ordinary (non-editable) install ships the SQL and the CLI works
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/blundriq_install
        run: |
          python -m venv /tmp/installed && /tmp/installed/bin/pip install -q .
          psql postgresql://postgres:ci@localhost:5432/postgres -c 'CREATE DATABASE blundriq_install'
          cd /tmp
          /tmp/installed/bin/pipeline db init
          /tmp/installed/bin/pipeline db version | tee /tmp/version.txt
          # A fresh install must record the installed package's latest migration number.
          expected="$(/tmp/installed/bin/python -c 'from core import schema; print(schema.latest_version())')"
          grep -qx "database: ${expected}; latest: ${expected}" /tmp/version.txt || { echo "unexpected version output"; exit 1; }

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test -- --run
      - run: npm run build

  secrets-scan:
    # Detection after publication. The pre-push hook is what prevents a leak;
    # this catches anything that got past it and blocks the merge. Runs the
    # gitleaks binary directly over the FULL history (the marketplace action
    # computes a commit range that breaks on a repository's first push).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.24.3
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan every commit
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
