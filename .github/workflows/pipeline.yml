name: pipeline

# The hourly run: `pipeline run` (the chain is core.runs.HOURLY_STEPS). The only workflow with
# access to the database secret. Each step logs a pipeline_runs row; a failure
# stops the chain and sends one alert (core/notify.py).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: write # the keepalive step re-enables this workflow
    steps:
      # The token can write to Actions in this job (the keepalive); nothing but that step gets it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Stockfish 18 (pinned to core/constants.STOCKFISH_VERSION)
        run: |
          curl -sSL -o /tmp/sf.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64-avx2.tar
          tar -xf /tmp/sf.tar -C /tmp
          sudo install -m 755 "$(find /tmp/stockfish -type f -name 'stockfish-ubuntu-x86-64-avx2')" /usr/local/bin/stockfish
          printf 'uci\nquit\n' | stockfish | head -1
      - run: bash tools/install.sh python runtime
      - name: Run the chain
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: pipeline run --analyze-limit 60
      # GitHub disables a public repository's scheduled workflows after 60 days without
      # repository activity, silently. Enabling the workflow on every run is meant to keep it
      # on; GitHub does not document that this resets the clock, so the operator also checks
      # the Actions tab now and then. Runs whether or not the chain succeeded.
      - name: Keep this schedule enabled
        id: keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # The console is public: the reply is discarded and a failure is one fixed line.
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable" --silent >/dev/null 2>&1 \
            || { echo "keepalive: FAILED"; exit 1; }
      # A failed keepalive turns the job red, which reaches no one; this sends the
      # application's own failure email, with a fixed label and nothing from the API's reply.
      - name: Alert when the keepalive failed
        if: always() && steps.keepalive.outcome == 'failure'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: pipeline alert keepalive
